name: Release
run-name: Release · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.actor }}

on:
  push:
    branches:
      - master
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - "packages/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.6.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @husky-di/remote exec playwright install --with-deps chromium firefox webkit

      - name: Detect pending changesets
        id: pending_changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages and changelog
        if: steps.pending_changesets.outputs.has_changesets == 'true'
        run: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version packages
        if: steps.pending_changesets.outputs.has_changesets == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages [skip ci]"
          git push origin HEAD:master

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Build authoritative release artifacts
        shell: bash
        run: |
          node packages/remote/scripts/finalize-declarations.mjs packages/core
          pnpm --filter @husky-di/core pack --pack-destination "$RUNNER_TEMP"
          echo "HUSKY_CORE_TGZ=$RUNNER_TEMP/husky-di-core-1.4.1.tgz" >> "$GITHUB_ENV"
          echo "A_TGZ=$RUNNER_TEMP/husky-di-remote-1.0.0.tgz" >> "$GITHUB_ENV"
          echo "HUSKY_REMOTE_TGZ=$RUNNER_TEMP/husky-di-remote-1.0.0.tgz" >> "$GITHUB_ENV"
          node packages/remote/scripts/release-evidence.mjs pack "$RUNNER_TEMP/husky-di-remote-1.0.0.tgz"

      - name: Verify authoritative release artifact
        run: pnpm --filter @husky-di/remote test:release

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$A_TGZ" --access public

      - name: Push release tags
        shell: bash
        run: git push origin --follow-tags
